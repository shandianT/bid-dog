name: build-installers
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "site/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.workflow }}-${{ github.ref }}
  # 主分支正在上传安装包时不能被新提交取消，否则可能留下半成品 Release。
  # PR/功能分支仍保留“只跑最新一次”以节省构建资源。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: offline regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - id: browser-tests
        name: detect Playwright checks
        shell: bash
        run: |
          if find tests -maxdepth 1 -name 'check_*.spec.js' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install browser test dependencies
        if: steps.browser-tests.outputs.present == 'true'
        working-directory: tests
        run: npm ci
      - name: install Playwright Chromium
        if: steps.browser-tests.outputs.present == 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: run offline regression suite
        run: bash tests/run_all.sh
      - name: upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            tests/.artifacts/
            tests/test-results/
            tests/playwright-report/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: installer-macos
            build_args: "-- --bundles dmg"
            artifact_paths: |
              app/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            artifact: installer-windows
            build_args: "-- --bundles nsis"
            artifact_paths: |
              app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: signing
        name: validate optional commercial-signing credentials
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          MAC_SIGNING_IDENTITY: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          MAC_APPLE_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_ID || '' }}
          MAC_APPLE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_PASSWORD || '' }}
          MAC_TEAM_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            present=0
            for value in "$MAC_CERTIFICATE" "$MAC_CERTIFICATE_PASSWORD" "$MAC_SIGNING_IDENTITY" "$MAC_APPLE_ID" "$MAC_APPLE_PASSWORD" "$MAC_TEAM_ID"; do
              [ -n "$value" ] && present=$((present + 1))
            done
            if [ "$present" -ne 0 ] && [ "$present" -ne 6 ]; then
              echo "Apple signing/notarization secrets are only partially configured; refusing an ambiguous release."
              exit 1
            fi
            if [ "$present" -eq 6 ]; then
              echo "MAC_SIGNING_READY=true" >> "$GITHUB_ENV"
              echo "mac_signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "MAC_SIGNING_READY=false" >> "$GITHUB_ENV"
              echo "mac_signed=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            present=0
            [ -n "$WINDOWS_CERTIFICATE" ] && present=$((present + 1))
            [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ] && present=$((present + 1))
            if [ "$present" -eq 1 ]; then
              echo "Windows signing secrets are only partially configured; refusing an ambiguous release."
              exit 1
            fi
            if [ "$present" -eq 2 ]; then
              echo "WINDOWS_SIGNING_READY=true" >> "$GITHUB_ENV"
              echo "windows_signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "WINDOWS_SIGNING_READY=false" >> "$GITHUB_ENV"
              echo "windows_signed=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: import Apple Developer certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING_READY == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE || '' }}
          p12-password: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      - name: import Windows Authenticode certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_READY == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "bid-dog-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows certificate import returned no thumbprint" }
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
          "TAURI_WINDOWS_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: build engine sidecar (内置引擎,客户免装 Python)
        shell: bash
        working-directory: server
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          python -m pip install --quiet pyinstaller fastapi uvicorn python-multipart python-docx pypdf certifi
          cp ../bidmultiagenttao_v5.3.zip . 2>/dev/null || true
          codesign_args=()
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MAC_SIGNING_READY" = "true" ]; then
            codesign_args=(--codesign-identity "$APPLE_SIGNING_IDENTITY")
          fi
          pyinstaller -F -n bid-engine engine_v1.py --collect-all uvicorn --collect-all certifi --collect-all docx \
            --add-data "bidmultiagenttao_v5.3.zip:." --noconfirm "${codesign_args[@]}"
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p ../app/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/bid-engine.exe "../app/src-tauri/binaries/bid-engine-$TRIPLE.exe"
          else
            cp dist/bid-engine "../app/src-tauri/binaries/bid-engine-$TRIPLE"
          fi
          ls -la ../app/src-tauri/binaries/
      - name: bundle OpenCode CLI (默认执行外壳,客户免装 Node/免登录)
        shell: bash
        working-directory: app
        run: |
          # 版本与引擎 OPENCODE_PIN 保持一致,并**钉死**不跟随 latest ——
          # 上游发版极频繁(npm 上万个版本),排队/并发编排正是 issue 最密集的区域,
          # 跟随 latest 等于把客户机当测试环境。
          OPENCODE_PIN=1.18.13
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          # ⚠ x64 一律打 **baseline** 变体:打包时不可能知道客户 CPU 支不支持 AVX2,
          # 而标准版在老 CPU 上是**直接崩**,报错完全看不出是指令集的问题。
          # 招投标客户里老工控机/老办公机不少,宁可慢一点也不能装上跑不起来。
          # arm64 没有 baseline 变体(AVX2 是 x86 指令集,实测 npm 上三个 arm64 baseline 全 404)。
          if [ "$RUNNER_OS" = "Windows" ]; then
            PKG=opencode-windows-x64-baseline
            INNER="package/bin/opencode.exe"; OUT="src-tauri/binaries/opencode-cli-$TRIPLE.exe"
          else
            PKG=opencode-darwin-arm64
            INNER="package/bin/opencode"; OUT="src-tauri/binaries/opencode-cli-$TRIPLE"
          fi
          curl -sSL --retry 3 "https://registry.npmjs.org/$PKG/-/$PKG-$OPENCODE_PIN.tgz" -o oc.tgz
          mkdir -p oc_x src-tauri/binaries
          tar xzf oc.tgz -C oc_x "$INNER"
          mv "oc_x/$INNER" "$OUT"
          chmod +x "$OUT" 2>/dev/null || true
          rm -rf oc.tgz oc_x
          "$OUT" --version || { echo "内置外壳跑不起来,不要发这个包"; exit 1; }
          ls -la src-tauri/binaries/
      - name: install deps & icons
        working-directory: app
        run: |
          npm ci
          npx tauri icon app-icon.png
      - name: build installers
        working-directory: app
        shell: bash
        env:
          # Do not expose empty APPLE_* names to Tauri: their mere presence enables notarization.
          MAC_SIGNING_IDENTITY_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          MAC_APPLE_ID_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_ID || '' }}
          MAC_APPLE_PASSWORD_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_PASSWORD || '' }}
          MAC_TEAM_ID_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # 没有商业证书时，macOS 也必须做 ad-hoc 签名：既保证整个 .app 资源封装有效，
          # 也会重签 npm 上游自带无效 linker signature 的 OpenCode sidecar。
          # 这不是 Apple Developer 签名/公证，用户仍需按 README 首次放行。
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MAC_SIGNING_READY" != "true" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MAC_SIGNING_READY" = "true" ]; then
            export APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY_SECRET"
            export APPLE_ID="$MAC_APPLE_ID_SECRET"
            export APPLE_PASSWORD="$MAC_APPLE_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$MAC_TEAM_ID_SECRET"
            npm run build ${{ matrix.build_args }} --config src-tauri/tauri.macos-signing.conf.json
          elif [ "$RUNNER_OS" = "Windows" ] && [ "$WINDOWS_SIGNING_READY" = "true" ]; then
            npm run build ${{ matrix.build_args }} --config "$TAURI_WINDOWS_SIGNING_CONFIG"
          else
            npm run build ${{ matrix.build_args }}
          fi
      - name: verify macOS DMG signature and bundled executables
        if: runner.os == 'macOS'
        working-directory: app
        shell: bash
        run: |
          dmg_path=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          mount_dir="$RUNNER_TEMP/bid-dog-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg_path"
          engine_pid=""
          cleanup() {
            if [ -n "$engine_pid" ]; then
              kill "$engine_pid" >/dev/null 2>&1 || true
              wait "$engine_pid" >/dev/null 2>&1 || true
            fi
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          app_path=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app_path"
          "$app_path/Contents/MacOS/opencode-cli" --version
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "0.19.6"
          if [ "$MAC_SIGNING_READY" = "true" ]; then
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          else
            signature=$(codesign -dv --verbose=4 "$app_path" 2>&1)
            printf '%s\n' "$signature" | grep -q 'Signature=adhoc'
            printf '%s\n' "$signature" | grep -q 'TeamIdentifier=not set'
          fi
          engine_data="$RUNNER_TEMP/bid-engine-smoke"
          engine_log="$RUNNER_TEMP/bid-engine-smoke.log"
          engine_port=18788
          mkdir -p "$engine_data"
          PORT="$engine_port" BID_HOME="$engine_data" BID_NO_UPDATE_CHECK=1 \
            "$app_path/Contents/MacOS/bid-engine" >"$engine_log" 2>&1 &
          engine_pid=$!
          health=""
          for _ in {1..30}; do
            if health=$(curl -fsS --max-time 1 "http://127.0.0.1:$engine_port/v1/health"); then
              break
            fi
            if ! kill -0 "$engine_pid" 2>/dev/null; then
              cat "$engine_log"
              exit 1
            fi
            sleep 1
          done
          test -n "$health" || { cat "$engine_log"; exit 1; }
          printf '%s' "$health" | python -c \
            'import json,sys; h=json.load(sys.stdin); assert h["ok"] is True and h["version"] == "0.19.6"'
          word_job="$engine_data/jobs/word-smoke"
          mkdir -p "$word_job"
          printf '%s\n' '{"name":"安装包 Word 冒烟","tender":"招标文件.docx"}' >"$word_job/任务.json"
          {
            printf '%s\n\n' '# 投标文件完整稿' '## 项目理解'
            for n in {1..80}; do printf '第%s段：本段用于验证安装包内置 Word 导出资源完整，内容仅用于发布冒烟测试。\n\n' "$n"; done
          } >"$word_job/投标文件_完整.md"
          word_result=$(curl -fsS -X POST "http://127.0.0.1:$engine_port/v1/jobs/word-smoke/export_docx")
          printf '%s' "$word_result" | python -c \
            'import json,sys; r=json.load(sys.stdin); assert r["ok"] is True and r["made"]'
          WORD_PATH="$word_job/投标文件_完整.docx" python -c \
            'import os,zipfile; p=os.environ["WORD_PATH"]; assert os.path.getsize(p)>1024 and zipfile.is_zipfile(p)'
          kill "$engine_pid" >/dev/null 2>&1 || true
          wait "$engine_pid" >/dev/null 2>&1 || true
          engine_pid=""
      - name: verify Windows installer payload and bundled executables
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }

          # 验证最终上传的 NSIS，而不是只测打包前的 binaries/。Tauri NSIS 官方支持 /S；
          # /D 固定到 runner 临时目录，避免依赖产品名或系统语言推算安装位置。
          $installRoot = Join-Path $env:RUNNER_TEMP "bid-dog-installed"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $installer = Start-Process -FilePath $installers[0].FullName `
            -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($installer.ExitCode)"
          }

          $engines = @(Get-ChildItem $installRoot -Recurse -Filter "bid-engine.exe" -File)
          $opencodes = @(Get-ChildItem $installRoot -Recurse -Filter "opencode-cli.exe" -File)
          if ($engines.Count -ne 1 -or $opencodes.Count -ne 1) {
            throw "installed payload is incomplete: bid-engine=$($engines.Count), opencode=$($opencodes.Count)"
          }
          $ocVersion = (& $opencodes[0].FullName --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $ocVersion -notmatch "1\.18\.13") {
            throw "installed baseline OpenCode did not run as 1.18.13: $ocVersion"
          }

          $engineData = Join-Path $env:RUNNER_TEMP "bid-engine-windows-smoke"
          $engineOut = Join-Path $env:RUNNER_TEMP "bid-engine-windows-smoke.out.log"
          $engineErr = Join-Path $env:RUNNER_TEMP "bid-engine-windows-smoke.err.log"
          New-Item -ItemType Directory -Force -Path $engineData | Out-Null
          $env:PORT = "18789"
          $env:BID_HOME = $engineData
          $env:BID_NO_UPDATE_CHECK = "1"
          $engine = $null
          try {
            $engine = Start-Process -FilePath $engines[0].FullName -PassThru `
              -RedirectStandardOutput $engineOut -RedirectStandardError $engineErr
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18789/v1/health" -TimeoutSec 1
                if ($health.ok) { break }
              } catch {
                if ($engine.HasExited) { break }
                Start-Sleep -Seconds 1
              }
            }
            if (-not $health -or -not $health.ok) {
              Get-Content $engineOut, $engineErr -ErrorAction SilentlyContinue
              throw "installed bid-engine.exe did not become healthy"
            }
            if ($health.version -ne "0.19.6") {
              throw "installed engine version mismatch: $($health.version)"
            }
            $wordJob = Join-Path $engineData "jobs\word-smoke"
            New-Item -ItemType Directory -Force -Path $wordJob | Out-Null
            '{"name":"installer Word smoke","tender":"tender.docx"}' |
              Set-Content -Encoding utf8 (Join-Path $wordJob "任务.json")
            $body = @("# 投标文件完整稿", "", "## 项目理解", "")
            $body += 1..80 | ForEach-Object {
              "Section ${_}: verify that the installed engine contains all Word export resources."
            }
            $body | Set-Content -Encoding utf8 (Join-Path $wordJob "投标文件_完整.md")
            $wordResult = Invoke-RestMethod -Method Post `
              -Uri "http://127.0.0.1:18789/v1/jobs/word-smoke/export_docx" -TimeoutSec 30
            if (-not $wordResult.ok -or $wordResult.made.Count -lt 1) {
              throw "installed engine could not export Word"
            }
            $wordPath = Join-Path $wordJob "投标文件_完整.docx"
            if (-not (Test-Path $wordPath) -or (Get-Item $wordPath).Length -lt 1024) {
              throw "installed engine produced no usable Word file"
            }
            if ($env:WINDOWS_SIGNING_READY -eq "true") {
              $signature = Get-AuthenticodeSignature $installers[0].FullName
              if ($signature.Status -ne "Valid") {
                throw "Windows installer Authenticode signature is not valid: $($signature.Status)"
              }
            }
          } finally {
            if ($engine -and -not $engine.HasExited) {
              Stop-Process -Id $engine.Id -Force -ErrorAction SilentlyContinue
              $engine.WaitForExit(5000) | Out-Null
            }
            Remove-Item Env:PORT, Env:BID_HOME, Env:BID_NO_UPDATE_CHECK -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.artifact_paths }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: enforce immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v0.19.6"
          release_rows=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "desktop-v0.19.6") | [.id, .draft, .target_commitish] | @tsv')
          release_count=$(printf '%s\n' "$release_rows" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$release_count" -gt 1 ]; then
            echo "Multiple releases exist for $tag; refusing an ambiguous update."
            exit 1
          fi
          if [ -n "$release_rows" ]; then
            IFS=$'\t' read -r existing_release_id release_draft release_target <<< "$release_rows"
            if [ "$release_draft" != "true" ]; then
              echo "Release $tag is already published; published releases are immutable."
              exit 1
            fi
            if [ "$release_target" != "$GITHUB_SHA" ]; then
              echo "Draft release desktop-v0.19.6 belongs to another commit; refusing to mix assets."
              exit 1
            fi
            echo "Found an unfinished draft for the same commit; resuming its asset upload safely."
          fi
          tag_rows=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [ -n "$tag_rows" ]; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit=$(git rev-list -n 1 "$tag")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag belongs to another commit; published releases are immutable."
              exit 1
            fi
            if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>/dev/null); then
              release_draft=$(printf '%s' "$release_json" | jq -r '.draft')
              if [ "$release_draft" != "true" ]; then
                echo "Release $tag is already published; published releases are immutable."
                exit 1
              fi
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: normalize release asset filenames
        run: |
          mkdir -p out
          find dist -type f \( -name '*.dmg' -o -name '*.exe' \) | while read -r f; do
            name="$(basename "$f" | sed -e 's/中标狗/bid-dog/g' -e 's/标书助手/bid-dog/g')"
            mv "$f" "out/$name"
          done
          test -f out/bid-dog_0.19.6_aarch64.dmg
          test -f out/bid-dog_0.19.6_x64-setup.exe
          test "$(find out -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          (cd out && sha256sum bid-dog_0.19.6_aarch64.dmg bid-dog_0.19.6_x64-setup.exe > SHA256SUMS)
          ls -la out
      - id: stage_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.19.6
          name: 中标狗桌面版 v0.19.6
          target_commitish: ${{ github.sha }}
          # Only a same-commit draft reaches this step; this repairs an interrupted partial upload.
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: true
          # 不再标 prerelease:标了的话 /releases/latest 与 /releases/latest/download/… 全部 404,
          # 官网和 README 的「下载最新版」就没法用一条稳定链接
          prerelease: false
          body: |
            中标狗桌面应用安装包（自动构建；未配置商业证书时 macOS 为 ad-hoc、Windows 为未签名）。作者:FDE-家涛。
            官网(含在线体验、成品 Word 页面):https://bid-dog.vercel.app

            - macOS Apple Silicon(M 系列): `bid-dog_0.19.6_aarch64.dmg`
            - Windows: `bid-dog_0.19.6_x64-setup.exe`
            - 校验文件: `SHA256SUMS`
            - 需 Intel Mac 时,把 workflow 矩阵加回 `platform: macos-13` 即可。

            **macOS 提示「已损坏,无法打开」?** 不是文件坏了,是系统对未公证应用的拦截。更新前先从托盘退出旧版，把新版拖入「应用程序」并替换、推出 DMG 后执行:
            `xattr -dr com.apple.quarantine "/Applications/中标狗.app"` 即可打开(或:系统设置 → 隐私与安全性 → 仍要打开)。每个新下载版本都可能再次需要放行。详见 README。
            Windows SmartScreen 提示时点「更多信息 → 仍要运行」。

            v0.19.6（完整说明见仓库更新日志）:
            - 断线重连同时兼容完整重放和只发新事件，不再丢失重连后的真实进度。
            - 异常退出后可从已落盘会话续做；暂停可正式停止并释放模型锁。
            - 停止请求可取消尚在预检、重做准备或续做连接中的未派发 worker。
            - 重跑增加幂等键，回答送达失败时保留原问题，旧问题不串入新会话。
            - 旧会话禁止跨模型、网关、Key、协议或 TLS 配置续写。
            - 发布门禁继续在最终 macOS DMG 和 Windows NSIS 载荷中实启引擎并导出 Word。

            完整历史版本说明见 CHANGELOG.md。
          files: |
            out/bid-dog_0.19.6_aarch64.dmg
            out/bid-dog_0.19.6_x64-setup.exe
            out/SHA256SUMS
      - name: verify staged release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="${{ steps.stage_release.outputs.id }}"
          case "$release_id" in
            ''|*[!0-9]*) echo "staged release id is missing or invalid"; exit 1 ;;
          esac
          # GitHub can take a few seconds to expose a new draft through the
          # tag endpoint. The action output is the stable numeric id and is
          # immediately readable, so verify and publish that exact draft.
          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python - "$RUNNER_TEMP/release.json" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if release.get("draft") is not True:
              raise SystemExit("release must remain a draft until all assets are verified")
          expected = {
              "bid-dog_0.19.6_aarch64.dmg",
              "bid-dog_0.19.6_x64-setup.exe",
              "SHA256SUMS",
          }
          assets = {item.get("name"): item for item in release.get("assets", [])}
          if set(assets) != expected:
              raise SystemExit(f"release assets mismatch: {sorted(assets)}")
          for name in sorted(expected):
              asset = assets[name]
              state = asset.get("state")
              size = int(asset.get("size") or 0)
              url = str(asset.get("browser_download_url") or "")
              if not (state == "uploaded" and size > 0 and url.startswith("https://")):
                  raise SystemExit(f"release asset is not ready: {name}")
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false -f make_latest=true > "$RUNNER_TEMP/published-release.json"
          python - "$RUNNER_TEMP/published-release.json" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if release.get("draft") is not False:
              raise SystemExit("release was not published")
          if release.get("tag_name") != "desktop-v0.19.6":
              raise SystemExit("published release tag mismatch")
          PY
