name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # 官网的在线体验就是 app-next 的构建产物,界面改了官网也必须重新部署
      - "app-next/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个上线任务;不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: build the web app into site/app
        run: |
          npm ci --prefix app-next
          npm run build --prefix app-next
          rm -rf site/app && mkdir -p site/app
          cp -R app-next/dist/. site/app/
          test -f site/app/index.html

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
