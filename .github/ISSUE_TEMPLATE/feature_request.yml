name: 功能建议
description: 提议新的场景或体验改进
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认建议中不包含客户机密、个人信息或完整投标文件。
          required: true
